# Publica el sitio de Quarto en GitHub Pages (rama gh-pages) en cada push a main.
# Usa los resultados congelados en _freeze/, por lo que no instala R.
name: Publicar sitio

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
